# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Java Build with Maven

on:
  push:
    branches: [ "main", "master" ] # Uruchom przy pushu na main lub master
  workflow_dispatch: # Pozwala na ręczne uruchomienie
  release:
    types: [created]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    - name: Build with Maven
      run: |
        echo "Building project..."
        mvn -B package -Dmaven.deploy.skip=true --file pom.xml
        echo "Build completed!"

    - name: Get artifact version
      id: get_version
      run: |
        VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "Artifact version: $VERSION"

    - name: Prepare JAR for upload
      run: |
        mkdir -p deploy
        cp benew-services/target/benew-services-*.jar deploy/benew-app.jar
        cp scripts/start.sh deploy/start.sh
        cp scripts/stop.sh deploy/stop.sh
        ls -lh deploy/
        echo "JAR file and others prepared for deployment"
    - name: Deploy to Mikr.us via SCP
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.MIKRUS_HOST }}
        username: ${{ secrets.MIKRUS_USER }}
        key: ${{ secrets.MIKRUS_SSH_KEY }}
        port: ${{ secrets.MIKRUS_PORT || 22 }}
        source: "deploy/benew-app.jar"
        target: "~/app2/"
        strip_components: 1

    - name: Restart application on server
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.MIKRUS_HOST }}
        username: ${{ secrets.MIKRUS_USER }}
        key: ${{ secrets.MIKRUS_SSH_KEY }}
        port: ${{ secrets.MIKRUS_PORT || 22 }}
        script: |
          echo "Restarting application..."
          cd ~/apps2

          # Stop current application
          sh stop.sh

          # Backup old version
          if [ -f benew-app-current.jar ]; then
            mv benew-app-current.jar benew-app.jar.bcp
          fi

          # Deploy new version
          mv benew-app.jar benew-app-current.jar
          
          sh start.sh
    - name: Deployment Status
      if: success()
      run: |
        echo "✅ Deployment completed successfully!"
        echo "Server: ${{ secrets.MIKRUS_HOST }}"
        echo "Version: ${{ steps.get_version.outputs.VERSION }}"

